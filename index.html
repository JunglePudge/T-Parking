<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <script>
        function openLoginWindow() {
            window.open('/auth/login', 'Login', 'width=600,height=400');
        }

        function openRegisterWindow() {
            window.open('/auth/register', 'Register', 'width=600,height=400');
        }
    </script>
</head>
<body>
    <h1>Добро пожаловать!</h1>
    <button onclick="openLoginWindow()">Вход</button>
    <button onclick="openRegisterWindow()">Регистрация</button>
</body>
</html>
