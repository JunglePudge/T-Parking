<body>
    <div class="Background">
        <div class="Middle"></div>
        <div class="Down"></div>
    </div>

    <div class="Logo">
        <div class="Image">
            <a href="/"><img src="/static/images/logo.JPG" alt="" width="62px" height="69px"></a>
        </div>
        <div class="Text">
            <a href="/"><p><b>ПАРКОВКА</b></p></a>
        </div>
    </div>

    <div class="Base">
        <!-- Контейнер для ошибок -->
        <div id="errorContainer" class="error-message">
            {% if error %}
                {{ error }}
            {% endif %}
        </div>

        <form action="/auth/register" method="post">
            <input type="text" name="fio" placeholder="ФИО (Иванов Иван Иванович)" required value="{{ fio or '' }}">
            <input type="email" name="email" placeholder="Email" required value="{{ email or '' }}">
            <input type="text" name="gos" placeholder="Госномер (А123БВ777)" required value="{{ gos or '' }}">
            <input type="password" name="password" placeholder="Пароль (минимум 8 символов)" required>
            <input type="password" name="again" placeholder="Повторите пароль" required>
            <div class="Center">
                <button type="submit" class="Button">Зарегистрироваться</button>
            </div>
        </form>
    </div>

    <!-- Переключатель Вход/Регистрация -->
    <div>
        <div class="Firsttext">
            <a href="/auth/login"><p>Вход</p></a>
        </div>
        <div class="Secondtext">
            <p>Регистрация</p>
        </div>
    </div>

    <!-- Линия разделитель -->
    <div class="Line"></div>

    <!-- Нижняя часть как в авторизации -->
    <div class="Logoup">
        <div class="Imageup">
            <img src="/static/images/logo3.png" alt="" width="69px" height="68px">
        </div>
        <div class="Textup">
            <p><b>ПАРКОВКА</b></p>
        </div>
    </div>

    <div class="Textdown">
        <div class="First">
            <p>О приложении</p>
        </div>
        <div class="Second">
            <p>Контакты</p>
        </div>
        <div class="Third">
            <p>При положительном решении платформы профиль будет подтвержден в день оформления заявки либо на следующий день...</p>
        </div>
        <div class="Line1"></div>
        <div class="Fourth">
            <p>© 2024—2024, АО «ТПарковка», официальный сайт...</p>
        </div>
    </div>

    <div class="Twolog0">
        <div class="Logo1">
            <img src="/static/images/telegram.png" alt="" width="42px" height="42px">
        </div>
        <div class="Logo2">
            <img src="/static/images/vk.png" alt="" width="44px" height="35px">
        </div>
    </div>

    <script>
        // Показываем ошибку, если она есть
        document.addEventListener('DOMContentLoaded', function() {
            const errorContainer = document.getElementById('errorContainer');
            const errorText = '{{ error }}';

            if (errorText && errorText !== 'None') {
                errorContainer.textContent = errorText;
                errorContainer.classList.add('error-visible');

                setTimeout(() => {
                    errorContainer.classList.remove('error-visible');
                }, 5000);
            }

            // Валидация формы на клиенте
            const form = document.querySelector('form');
            form.addEventListener('submit', function(e) {
                const password = document.querySelector('input[name="password"]').value;
                const again = document.querySelector('input[name="again"]').value;
                const fio = document.querySelector('input[name="fio"]').value;

                if (password !== again) {
                    e.preventDefault();
                    showError('Пароли не совпадают');
                    return;
                }

                if (password.length < 8) {
                    e.preventDefault();
                    showError('Пароль должен содержать минимум 8 символов');
                    return;
                }

                const fioParts = fio.trim().split(/\s+/);
                if (fioParts.length < 3) {
                    e.preventDefault();
                    showError('Введите ФИО полностью (Имя Фамилия Отчество)');
                    return;
                }
            });

            function showError(message) {
                const errorContainer = document.getElementById('errorContainer');
                errorContainer.textContent = message;
                errorContainer.classList.add('error-visible');

                setTimeout(() => {
                    errorContainer.classList.remove('error-visible');
                }, 5000);
            }
        });
    </script>
</body>
