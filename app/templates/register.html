        <div class="Text">
            <a href="/"><p><b>ПАРКОВКА</b></p></a>

    <div class="Base">
        <form action="/auth/register" method="post">
            <input type="text" name="fio" placeholder="ФИО" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="gos" placeholder="Госномер" required pattern="[А-Я][0-9]{3}[А-Я]{2}[0-9]{2,3}">
            <input type="password" name="password" placeholder="Пароль" required>
            <input type="password" name="again" placeholder="Повторите пароль" required>
            <div class="Center">
                <button type="submit" class="Button">Зарегистрироваться</button>
            </div>
        </form>
    </div>

    <div>
        <div class="Firsttext">
            <a href="/auth/login"><p>Вход</p></a>
